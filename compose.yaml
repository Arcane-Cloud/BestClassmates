services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: best_classmates
      MYSQL_USER: classmates
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD for local development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for local development}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - classmates-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u classmates --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  classmates-mysql:
